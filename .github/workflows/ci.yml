# The verification gate in CI, one tier per trigger (docs/TESTING_REALITY.md "CI tiers", DECISIONS.md D30):
#   push          GATE_TIER=push    fast backend tests (parallel), static checks, frontend checks          target < 8 min
#   pull_request  GATE_TIER=pr      + slow backend files, reality stages + live-coverage proof, browser stages
#                                     for the shipped default (action_sim), mutants of the files the PR changed  target ~15 min
#   nightly       GATE_TIER=full    + the whole mutation check, Docker, user journeys
#   weekly        GATE_TIER=weekly  + research detectors (D7-D9c) parity, and the real Claude Code client only if ANTHROPIC_API_KEY is set
# The verdict is scripts/verify.sh's exit code; the per-stage event log and the junit XML are uploaded as artifacts.
name: gate

on:
  push:
  pull_request:
  schedule:
    - cron: "23 2 * * 1-6"   # nightly: full (Mon-Sat)
    - cron: "23 2 * * 0"     # weekly: weekly (Sunday; includes everything full runs)
  workflow_dispatch:
    inputs:
      tier:
        description: GATE_TIER
        type: choice
        options: [push, pr, full, weekly]
        default: pr

permissions:
  contents: read

concurrency:
  # a newer run on the same ref (and trigger) cancels the superseded one
  group: gate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ github.event_name == 'push' && 25 || github.event_name == 'pull_request' && 50 || 240 }}
    env:
      EVENT: ${{ github.event_name }}
      SCHEDULE: ${{ github.event.schedule }}
      INPUT_TIER: ${{ inputs.tier }}
      HAS_CLAUDE_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      OMP_NUM_THREADS: "1"
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the pr tier's changed-files mutants diff against the base branch

      - name: Pick the tier
        id: tier
        run: |
          case "$EVENT" in
            push) t=push ;;
            pull_request) t=pr ;;
            schedule) if [ "$SCHEDULE" = "23 2 * * 0" ]; then t=weekly; else t=full; fi ;;
            workflow_dispatch) t="$INPUT_TIER" ;;
            *) echo "unknown event $EVENT"; exit 1 ;;
          esac
          echo "tier=$t" >> "$GITHUB_OUTPUT"
          echo "GATE_TIER=$t" >> "$GITHUB_ENV"
          echo "GATE_TIER=$t"

      - uses: actions/setup-python@v5
        id: setup-python
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements-dev.txt
            requirements-proxy.txt
            server/requirements.txt
            seismograph/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            tests/realdeps/package-lock.json

      - name: Python dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Cache the MiniLM model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      - name: Fetch the MiniLM model (once; every later step runs with HF_HUB_OFFLINE=1)
        run: |
          python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"
          echo "HF_HUB_OFFLINE=1" >> "$GITHUB_ENV"

      - name: Frontend dependencies
        run: cd frontend && npm ci --no-audit --no-fund

      - name: Cache Playwright browsers
        if: steps.tier.outputs.tier != 'push'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}

      - name: Chromium for the browser stages
        if: steps.tier.outputs.tier != 'push'
        run: |
          cd frontend
          npx playwright install --with-deps chromium
          echo "CHROMIUM_PATH=$(node -e "console.log(require('@playwright/test').chromium.executablePath())")" >> "$GITHUB_ENV"

      - name: Cache the real MCP servers (.realdeps)
        if: steps.tier.outputs.tier != 'push'
        uses: actions/cache@v4
        with:
          path: .realdeps
          key: realdeps-${{ runner.os }}-py${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('tests/realdeps/package-lock.json', 'scripts/realdeps_setup.sh') }}

      - name: Real MCP servers
        if: steps.tier.outputs.tier != 'push'
        run: bash scripts/realdeps_setup.sh

      - name: Allow the sandbox tests' user namespaces (every tier; they fail, not skip, without them)
        # Ubuntu 24.04 blocks unprivileged user namespaces by default; Landlock + netns sandbox tests run from the push tier on and
        # SENTINEL_SANDBOX_REQUIRED=1 (below) turns a missing sandbox into a failure instead of a silent skip.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Claude Code CLI (weekly, only with a key)
        if: steps.tier.outputs.tier == 'weekly' && env.HAS_CLAUDE_KEY == 'true'
        run: npm install -g @anthropic-ai/claude-code

      - name: Gate
        env:
          GATE_EVENTS: ${{ runner.temp }}/gate/events.log
          GATE_JUNIT_DIR: ${{ runner.temp }}/gate/junit
          # changed-files mutants (pr tier) diff against the PR's base, otherwise against the default branch; a missing ref is RED
          GATE_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || format('origin/{0}', github.event.repository.default_branch) }}
          GATE_PYTEST_WORKERS: auto
          SENTINEL_SANDBOX_REQUIRED: "1"
          # nightly and weekly: Docker (the runner's own daemon, no proxy variables) and the user journeys
          RUN_DOCKER_TESTS: ${{ (steps.tier.outputs.tier == 'full' || steps.tier.outputs.tier == 'weekly') && '1' || '0' }}
          RUN_JOURNEY_TESTS: ${{ (steps.tier.outputs.tier == 'full' || steps.tier.outputs.tier == 'weekly') && '1' || '0' }}
          # weekly only, and only with a key: a real Claude Code client (real model calls). verify.sh moves the key out of the environment
          # before any stage runs and hands it (as ANTHROPIC_API_KEY) to the claude stage alone; it is never printed or put in argv.
          RUN_CLAUDE_TESTS: ${{ (steps.tier.outputs.tier == 'weekly' && env.HAS_CLAUDE_KEY == 'true') && '1' || '0' }}
          SENTINEL_CLAUDE_API_KEY: ${{ steps.tier.outputs.tier == 'weekly' && secrets.ANTHROPIC_API_KEY || '' }}
        run: |
          mkdir -p "$GATE_JUNIT_DIR"
          bash scripts/verify.sh

      - name: Stage times
        if: always()
        run: cat "${{ runner.temp }}/gate/events.log" || true

      - name: Upload the browser stages' traces and screenshots (one directory per stage)
        if: failure() || cancelled()   # cancelled includes a job that hit its timeout
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results-${{ steps.tier.outputs.tier }}-${{ github.run_id }}
          path: |
            frontend/e2e/.results/
            frontend/journeys/.results/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload the gate events and junit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gate-${{ steps.tier.outputs.tier }}-${{ github.run_id }}
          path: ${{ runner.temp }}/gate/
          if-no-files-found: warn
          retention-days: 14
