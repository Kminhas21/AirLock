[pytest]
pythonpath = . server
testpaths = tests
asyncio_mode = auto
addopts = -q -m "not reality"
markers =
    real_model: uses the cached all-MiniLM-L6-v2 model (runs by default; skipped only if the model cache is absent)
    docker: runs real containers; needs Docker and SENTINEL_DOCKER_TESTS=1 (see scripts/docker_test.sh)
    reality: runs real processes (hostile model, real MCP servers, load); minutes; own gate stages: pytest -m reality tests/hostile|realdeps|load
